<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{{NAME}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --accent:#E8BE76; --glow:0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body { margin:0; background:#080706; color:#F7F1E6; overflow:hidden;
         font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
         display:flex; flex-direction:column; align-items:center;
         padding:max(18px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); }

  /* Edge lighting: the whole screen glows in the assistant's colour while it is listening or working. */
  .edge { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:var(--glow);
          transition:opacity .45s ease; }
  .edge span { position:absolute; }
  .edge .t { top:0; left:0; right:0; height:120px;
             background:linear-gradient(to bottom, color-mix(in srgb,var(--accent) 40%,transparent), transparent); }
  .edge .b { bottom:0; left:0; right:0; height:120px;
             background:linear-gradient(to top, color-mix(in srgb,var(--accent) 40%,transparent), transparent); }
  .edge .l { top:0; bottom:0; left:0; width:70px;
             background:linear-gradient(to right, color-mix(in srgb,var(--accent) 30%,transparent), transparent); }
  .edge .r { top:0; bottom:0; right:0; width:70px;
             background:linear-gradient(to left, color-mix(in srgb,var(--accent) 30%,transparent), transparent); }
  .edge.pulse { animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:calc(var(--glow)*.55); } 50% { opacity:var(--glow); } }

  .stage { position:relative; width:min(78vw,300px); aspect-ratio:1; margin:6px 0 2px;
           display:flex; align-items:center; justify-content:center; }
  .halo { position:absolute; inset:-14%; border-radius:50%;
          background:radial-gradient(circle, color-mix(in srgb,var(--accent) 38%,transparent) 30%, transparent 68%); }
  svg.face { width:100%; height:100%; overflow:visible; }

  .name { font-size:14px; letter-spacing:6px; font-weight:600; margin:10px 0 3px; }
  .label { color:#A69C8D; font-size:13px; min-height:18px; letter-spacing:.3px; }

  .talk { width:100%; max-width:480px; margin-top:14px; flex:1; overflow-y:auto; }
  .bubble { background:#15110D; border:1px solid #2A2419; border-radius:16px; padding:11px 14px;
            margin-bottom:9px; font-size:15px; line-height:1.45; animation:rise .25s ease; }
  .bubble.you { background:#241E15; color:#D8CEBE; }
  .bubble .who { display:block; font-size:10px; letter-spacing:1.4px; color:#8A8174; margin-bottom:3px; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } }

  /* The level meter: it is always listening, and this shows it hearing you. */
  .level { display:flex; align-items:flex-end; gap:4px; height:26px; margin:8px 0 2px; }
  .level i { width:4px; border-radius:2px; background:var(--accent); height:4px;
             transition:height .09s ease-out; opacity:.85; }
  .tip { color:#8A8174; font-size:12px; min-height:16px; }
  .controls { display:flex; gap:10px; margin-top:8px; }
  .chip { background:#15110D; border:1px solid #3A3122; color:#D8CEBE; border-radius:999px;
          padding:9px 18px; font-size:13px; }
  .chip.off { background:var(--accent); color:#080706; border-color:transparent; }

  form { display:flex; gap:8px; width:100%; max-width:480px; padding-top:12px; }
  input { flex:1; background:#15110D; border:1px solid #3A3122; color:#F7F1E6; border-radius:14px;
          padding:13px 14px; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  button.go { background:var(--accent); color:#080706; border:0; border-radius:14px; padding:0 20px;
              font-size:16px; font-weight:600; }
  button.go:disabled { opacity:.45; }
</style></head>
<body>
<div class="edge" id="edge"><span class="t"></span><span class="b"></span><span class="l"></span><span class="r"></span></div>

<div class="stage">
  <div class="halo" id="halo"></div>
  <svg class="face" viewBox="0 0 200 200" id="svg">
    <defs>
      <clipPath id="sphereClip"><circle cx="100" cy="100" r="44"/></clipPath>
      <!-- a ring is cut in two along its flattened axis: the far half goes behind the glass -->
      <clipPath id="far"><rect x="0" y="0" width="200" height="100"/></clipPath>
      <clipPath id="near"><rect x="0" y="100" width="200" height="100"/></clipPath>
      <radialGradient id="glass" gradientUnits="userSpaceOnUse" cx="96" cy="90" r="55">
        <stop offset="0" stop-color="#2C2216"/><stop offset=".55" stop-color="#17130F"/><stop offset="1" stop-color="#0C0A07"/>
      </radialGradient>
      <radialGradient id="lightA" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="46">
        <stop offset="0" id="la0"/><stop offset=".3" id="la1"/><stop offset=".7" id="la2"/><stop offset="1" id="la3"/>
      </radialGradient>
      <radialGradient id="lightB" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="32">
        <stop offset="0" id="lb0"/><stop offset="1" id="lb1"/>
      </radialGradient>
      <radialGradient id="edge" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="44">
        <stop offset="0" id="e0"/><stop offset=".74" id="e1"/><stop offset=".93" id="e2"/><stop offset="1" id="e3"/>
      </radialGradient>
      <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="81" cy="78" r="12">
        <stop offset="0" stop-color="#FFF8E6" stop-opacity=".45"/><stop offset="1" stop-color="#FFF8E6" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="back"></g>
    <g id="motesBack"></g>

    <g id="sphere">
      <circle cx="100" cy="100" r="44" fill="url(#glass)"/>
      <g clip-path="url(#sphereClip)">
        <g id="lightGroupA"><circle cx="100" cy="100" r="62" fill="url(#lightA)"/></g>
        <g id="lightGroupB"><circle cx="100" cy="100" r="62" fill="url(#lightB)"/></g>
      </g>
      <circle id="rim" cx="100" cy="100" r="44" fill="url(#edge)"/>
      <path d="M69 87 A37 37 0 0 1 90 66" fill="none" stroke="#FFF8E6" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M98 63 A37 37 0 0 1 106 63" fill="none" stroke="#FFF8E6" stroke-opacity=".22" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="81" cy="78" r="12" fill="url(#bloom)"/>
      <rect x="84" y="73" width="4" height="2.4" rx="1.2" fill="#FFFFF5" fill-opacity=".8" transform="rotate(-34 86 74)"/>
      <circle id="hair" cx="100" cy="100" r="43.6" fill="none" stroke-width=".8"/>
    </g>

    <g id="front"></g>
    <g id="motesFront"></g>
    <path id="arc" fill="none" stroke-width="2" stroke-linecap="round" opacity="0"/>
    <circle id="dot" cx="100" cy="168" r="2.6" opacity="0"/>
  </svg>
</div>

<div class="name">{{NAME}}</div>
<div class="label" id="label">connecting…</div>

<div class="talk" id="talk"></div>

<div class="level" id="level"></div>
<div class="tip" id="tip">starting…</div>
<div class="controls">
  <button class="chip" id="pause">Pause</button>
  <button class="chip" id="hide">Hide</button>
</div>

<form id="form" autocomplete="off">
  <input id="text" placeholder="or type…" enterkeyhint="send">
  <button class="go" id="send">Go</button>
</form>
</body></html>
